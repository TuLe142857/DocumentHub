<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Verification Code</title>
</head>

<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8;padding:40px 0;">
<tr>
<td align="center">

<table width="420" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:30px;box-shadow:0 2px 8px rgba(0,0,0,0.05);">

<tr>
<td style="text-align:center;font-size:22px;font-weight:bold;color:#333;">
Verify Your Email
</td>
</tr>

<tr><td height="20"></td></tr>

<tr>
<td style="font-size:15px;color:#555;text-align:center;">
Use the verification code below to continue.
</td>
</tr>

<tr><td height="25"></td></tr>

<tr>
<td align="center">
<div style="
font-size:32px;
letter-spacing:6px;
font-weight:bold;
color:#2d3748;
background:#f1f5f9;
padding:14px 24px;
border-radius:6px;
display:inline-block;
">
{{ otp_code }}
</div>
</td>
</tr>

<tr><td height="25"></td></tr>

<tr>
<td style="font-size:14px;color:#666;text-align:center;">
This code will expire in <b>{{ expire_minutes }} minutes</b>.
</td>
</tr>

<tr><td height="30"></td></tr>

<tr>
<td style="font-size:12px;color:#999;text-align:center;line-height:18px;">
If you didn’t request this code, you can safely ignore this email.
</td>
</tr>

<tr><td height="20"></td></tr>

<tr>
<td style="font-size:12px;color:#bbb;text-align:center;">
© {{ year }} Your Company
</td>
</tr>

</table>

</td>
</tr>
</table>

</body>
</html>
