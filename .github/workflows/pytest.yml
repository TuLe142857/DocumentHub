name: Run pytest
on:
  push:
    branches: [master]


jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup for build
        run: cp .env.example .env
        run: mkdir backend/test_reports
      - run: make build
      - run: make test