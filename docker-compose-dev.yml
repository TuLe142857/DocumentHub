x-backend-default: &backend-build-default
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: dev
    args:
        UID: ${UID-1000}
        GID: ${GID-1000}
  environment:
    BACKEND_CORS_ORIGINS: >
      "
      http://localhost,
      http://localhost:8000,
      http://localhost:${FRONTEND_PORT_EXTERNAL:-5173},
      http://localhost:${NGINX_PORT_EXTERNAL:-80},
      "

    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_URL_OVERRIDE: http://localhost:${NGINX_PORT_EXTERNAL:-80}/minio

services:
  proxy:
    volumes:
      - ./docker/nginx/templates/dev.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      FRONTEND_ENDPOINT: http://frontend:5173
      BACKEND_ENDPOINT: http://backend:8000
      MINIO_ENDPOINT: http://minio:9000/
    ports:
      - "${NGINX_PORT_EXTERNAL:-80}:80"

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT_EXTERNAL:-8000}/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT_EXTERNAL:-5173}:5173"

  backend:
    <<: *backend-build-default
    volumes:
      # DO NOT MOUNT ./backend:/app. This will override /app/.venv with your ./backend/.venv which may raise error
      - ./backend/app/:/app/backend/app/
      # - ./backend/pyproject.toml:/app/pyproject.toml
      # - ./backend/uv.lock:/app/uv.lock
      - ./backend/test_reports/:/app/backend/test_reports/
      - ./backend/tests/:/app/backend/tests/
      - ./backend/scripts:/app/backend/scripts/
    ports:
      - "${BACKEND_PORT_EXTERNAL:-8000}:8000"

  celery_worker:
    <<: *backend-build-default
    volumes:
      # DO NOT MOUNT ./backend:/app. This will override /app/.venv with your ./backend/.venv which may raise error
      - ./backend/app:/app/backend/app
      # - ./backend/pyproject.toml:/app/pyproject.toml
      # - ./backend/uv.lock:/app/uv.lock
    command: watchfiles "celery worker --loglevel=DEBUG --concurrency=4" app

  celery_beat:
    <<: *backend-build-default
    volumes:
      # DO NOT MOUNT ./backend:/app. This will override /app/.venv with your ./backend/.venv which may raise error
      - ./backend/app:/app/backend/app
      # - ./backend/pyproject.toml:/app/pyproject.toml
      # - ./backend/uv.lock:/app/uv.lock
    command: watchfiles "celery beat --loglevel=DEBUG"

  db:
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d/
      - ./docker/backup/mysql:/var/backup/mysql/
      - db_data_dev:/var/lib/mysql
    ports:
      - "${MYSQL_PORT_EXTERNAL:-3306}:3306"

  redis:
    volumes:
      - redis_data_dev:/data
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"

  minio:
    volumes:
      - minio_data_dev:/data
      - ./docker/backup/minio/:/var/backup/minio/
    ports:
      - "${MINIO_API_PORT_EXTERNAL:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_EXTERNAL:-9001}:9001"

  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_USERNAME: ${REDIS_USER:?Variable is not set or empty}
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:?Variable is not set or empty}
      RI_REDIS_DB: 0
    volumes:
      - redis_insight_data_dev:/data
    ports:
      - "${REDIS_INSIGHT_PORT_EXTERNAL:-5540}:5540"
    depends_on:
      redis:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "${MAIL_HOG_SERVER_PORT_EXTERNAL:-1025}:1025"
      - "${MAIL_HOG_CONSOLE_PORT_EXTERNAL:-8025}:8025"

  gotenberg:
    ports:
      - "${GOTENBER_PORT_EXTERNAL:-3000}:3000"
    environment:
      API_ENABLE_DEBUG_ROUTE: true
      LIBREOFFICE_AUTO_START: true

volumes:
  db_data_dev:
  redis_data_dev:
  redis_insight_data_dev:
  minio_data_dev: